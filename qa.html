<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Questions - Paris Games Week</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <img src="images/logo-ailco.png" alt="EILCO logo">
  <h1>Paris Games Week</h1>
  <img src="images/logo-stugamers.png" alt="Ch'tis Gamers logo">
  <img src="images/logo-pgw.png" alt="PGW logo">
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="qa.html">Questions</a>
  <a id="nav-admin" href="admin.html" style="display:none;">Admin</a>
  <a id="nav-logout" href="#" onclick="logout()" style="display:none;">Log out</a>
</nav>

<div class="user-badge" id="user-badge"></div>

<main>
  <section>
    <h2>Ask a Question</h2>
    <p>Everyone can see your question and our answer here.</p>
    <textarea id="question-input" placeholder="Type your question..."></textarea>
    <button class="btn" onclick="handleAsk()">Post Question</button>
  </section>

  <section>
    <h2>All Questions</h2>
    <div id="questions-list"></div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/qa.js"></script>
<script>
const user = getCurrentUser();
const badge = document.getElementById("user-badge");
if (user.username) {
  badge.innerText = "Logged in as: " + (user.isAdmin ? "Admin" : user.username);
  document.getElementById("nav-logout").style.display = "inline";
  if (user.isAdmin) document.getElementById("nav-admin").style.display = "inline";
} else {
  badge.innerHTML = '<a href="login.html" class="btn login-btn">Log in</a>';
}

function handleAsk() {
  const input = document.getElementById("question-input");
  postQuestion(input.value);
  input.value = "";
}

renderQuestions(document.getElementById("questions-list"), false);
</script>

</body>
</html>
