<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Paris Games Week - Join</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <h1>Paris Games Week</h1>
</header>

<main>
  <div class="login-box">
    <h2>Enter your username</h2>
    <p>No password needed, just type any name to join the discussion.</p>
    <input type="text" id="username-input" placeholder="Your username" />
    <button class="btn" onclick="handleLogin()">Enter</button>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
function handleLogin() {
  const val = document.getElementById("username-input").value;
  loginWithUsername(val);
}
document.getElementById("username-input").addEventListener("keydown", e => {
  if (e.key === "Enter") handleLogin();
});
</script>

</body>
</html>
